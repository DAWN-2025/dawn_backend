version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: dawn-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - dawn-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  spring-boot-app:
    image: ${ECR_REGISTRY}/dawn-backend:latest
    container_name: dawn-backend
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - ./dawn-backend/.env
    environment:
      RAG_API_URL: http://rag-api:8000

  rag-api:
    image: ${ECR_REGISTRY}/dawn-rag-api:latest
    container_name: dawn-rag-api
    ports:
      - "8000:8000"
    env_file:
      - ./dawn-AI/.env

volumes:
  dawn-mysql-data: