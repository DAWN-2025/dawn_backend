name: Deploy To EC2 With Docker

on:
  push:
    branches: [feature/deploy-docker]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ap-northeast-2
      BACKEND_REPO: dawn-backend
      RAG_REPO: dawn-rag-api
      REMOTE_DIR: /home/ubuntu/dawn-server

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK for Spring
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build Spring (Gradle)
        run: |
          cd dawn-backend
          ./gradlew clean build -x test

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ✅ 루트에 .env 작성 (MySQL + Backend + RAG 공용)
      - name: Write .env file
        run: |
          echo "DB_NAME=${{ secrets.DB_NAME }}" >> .env
          echo "DB_USER=${{ secrets.DB_USER }}" >> .env
          echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
          echo "DB_ROOT_PASSWORD=${{ secrets.DB_ROOT_PASSWORD }}" >> .env
          echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env

      - name: Write GCP credential json
        run: echo "${{ secrets.GCP_CREDENTIAL_JSON }}" > dawn-AI/dawn-a6a20-c9d639db0137.json

      - name: Build & Push RAG Docker image (with BuildKit Cache)
        run: |
          docker buildx create --use || true

          docker buildx build \
            --platform linux/amd64 \
            --cache-from=type=registry,ref=${{ steps.login-ecr.outputs.registry }}/${{ env.RAG_REPO }}:cache \
            --cache-to=type=registry,ref=${{ steps.login-ecr.outputs.registry }}/${{ env.RAG_REPO }}:cache,mode=max \
            -t ${{ steps.login-ecr.outputs.registry }}/${{ env.RAG_REPO }}:latest \
            --push \
            ./dawn-AI

      - name: Write firebase-admin.json
        run: echo "${{ secrets.FIREBASE_ADMIN_JSON }}" > dawn-backend/src/main/resources/firebase-admin.json

      - name: Build & Push Backend Docker image
        run: |
          docker build -t ${{ env.BACKEND_REPO }} ./dawn-backend
          docker tag ${{ env.BACKEND_REPO }}:latest ${{ steps.login-ecr.outputs.registry }}/${{ env.BACKEND_REPO }}:latest
          docker push ${{ steps.login-ecr.outputs.registry }}/${{ env.BACKEND_REPO }}:latest

      - name: Debug file existence
        run: |
          echo "Files in root:"
          ls -al
          echo "Files in dawn-AI:"
          ls -al dawn-AI
          echo "--- .env content ---"
          cat .env || echo ".env not found"

      - name: Create remote directory
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          script: |
            mkdir -p /home/ubuntu/dawn-server/current

      # ✅ docker-compose.yml + .env 함께 업로드
      - name: Upload docker-compose.yml & env files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          source: .env,docker-compose.yml
          target: ${{ env.REMOTE_DIR }}/current

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          script: |
            cd ${{ env.REMOTE_DIR }}/current

            # ✅ ECR 로그인
            aws ecr get-login-password --region ${{ env.AWS_REGION }} \
              | docker login --username AWS --password-stdin ${{ steps.login-ecr.outputs.registry }}

            docker pull ${{ steps.login-ecr.outputs.registry }}/${{ env.BACKEND_REPO }}:latest
            docker pull ${{ steps.login-ecr.outputs.registry }}/${{ env.RAG_REPO }}:latest

            docker compose down || true
            docker compose up -d --remove-orphans
            docker compose ps